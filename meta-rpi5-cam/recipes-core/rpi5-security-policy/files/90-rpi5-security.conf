# Drop only unicast IPv6 carried in link-layer multicast/broadcast frames.
# "all" alone does not enforce this IPv6 setting. Cover current interfaces,
# future interfaces (default), and udev's per-interface sysctl reapplication.
net.ipv6.conf.all.drop_unicast_in_l2_multicast = 1
net.ipv6.conf.default.drop_unicast_in_l2_multicast = 1
net.ipv6.conf.*.drop_unicast_in_l2_multicast = 1

# Preserve the image's existing discard policy explicitly. Do not create core
# files in a crashing process's working directory, including SUID descendants.
# This is deployment mitigation, not a change to the kernel dumpable logic.
kernel.core_pattern = |/bin/false
kernel.core_pipe_limit = 1
fs.suid_dumpable = 0
