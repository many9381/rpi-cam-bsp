# BCM43455 + the pinned brcmfmac driver does not report completion of the
# firmware WPA handshake to wpa_supplicant 2.11. Authenticate in userspace to
# avoid association followed by a 10-second authentication timeout.
# BRCMF_FEAT_FWSUP is bit 13 in the pinned Raspberry Pi 6.18 kernel.
options brcmfmac feature_disable=0x2000
