header:
  version: 19
  includes:
    - kas/rpi5-minimal.yml

target: rpi5-camera-image

# Optional private/local Git transport; source revision remains recipe-pinned.
env:
  CAMERA_FIRMWARE_GIT_URI: null

repos:
  meta-openembedded:
    layers:
      meta-oe:
      meta-python:
      meta-multimedia:

local_conf_header:
  rpi5-camera: |
    hostname:pn-base-files = "rpi5-camera"
    RASPBERRYPI_CAMERA_V3 = "1"
    PACKAGECONFIG:append:pn-libcamera-apps = " libav"
    PACKAGECONFIG:append:pn-rpidistro-ffmpeg = " x264"
    PACKAGECONFIG:append:pn-gstreamer1.0-plugins-bad = " srtp"
    LICENSE_FLAGS_ACCEPTED += " commercial"
